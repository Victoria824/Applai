<h1>AutoApply</h1>
<p>全自动求职投递工具（MVP）：浏览器插件，在公司官网职位页自动填写申请表单；遇到验证码进待人工队列并手机推送提醒。</p>
<div class="card">
<h3>🧪 在线演示页</h3>
<p>安装插件后，打开演示申请页即可一键体验自动填写：</p>
<a class="btn" href="demo/greenhouse-demo.html">打开演示页 →</a>
</div>
<div class="card">
<h3>🔌 安装插件</h3>
<p>Chrome 打开 <code>chrome://extensions</code> → 开发者模式 → 「加载已解压的扩展程序」→ 选择本仓库 <code>extension/</code> 目录。</p>
<p>源码：<a href="https://github.com/Victoria824/auto-apply-tool">github.com/Victoria824/auto-apply-tool</a></p>
</div>
