<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Applai — 登录</title>
<meta name="theme-color" content="#111827">
<link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--red:#b91c1c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:28px 24px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.06);}
h1{margin:0 0 4px;font-size:22px;letter-spacing:.5px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;}
input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);}
button{width:100%;font-size:16px;padding:12px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;margin-top:18px;cursor:pointer;font-weight:600;}
button:active{transform:scale(.98);}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px;}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px;}
.tabs{display:flex;gap:8px;margin-bottom:6px;}
.tabs button{margin-top:0;padding:9px;}
.tabs button.on{background:var(--accent);color:#fff;}
.tabs button:not(.on){background:#fff;color:var(--ink);border:1px solid var(--line);}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <h1>Applai</h1>
  <div class="sub">自动求职控制台</div>
  <div class="tabs">
    <button id="tabLogin" class="on">登录</button>
    <button id="tabReg">注册</button>
  </div>
  <form id="form" autocomplete="on">
    <label>用户名 <span style="font-size:11px">（3–32 位，字母/数字/_/-）</span></label>
    <input id="username" name="username" autocomplete="username" required>
    <label>密码 <span style="font-size:11px">（至少 8 位）</span></label>
    <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
    <div class="err" id="err"></div>
    <button type="submit" id="submitBtn">登录</button>
  </form>
  <div class="hint">注册后即可使用：管理求职画像、查看匹配队列与投递进度。<br>要在 Chrome 插件里自动填表，需在登录后的「连接插件」里复制 API Token。</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let mode = "login";
$("tabLogin").onclick = () => { mode = "login";
  $("tabLogin").classList.add("on"); $("tabReg").classList.remove("on");
  $("submitBtn").textContent = "登录"; $("err").textContent = ""; };
$("tabReg").onclick = () => { mode = "register";
  $("tabReg").classList.add("on"); $("tabLogin").classList.remove("on");
  $("submitBtn").textContent = "注册并进入"; $("err").textContent = ""; };
$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  const body = { username: $("username").value.trim(), password: $("password").value };
  try {
    const r = await fetch(`/api/v1/auth/${mode}`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      credentials: "include", body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("err").textContent = d.detail || "请求失败"; return; }
    location.href = "/dashboard";
  } catch (err) { $("err").textContent = "网络错误：" + err.message; }
};
</script>
</body>
</html>
