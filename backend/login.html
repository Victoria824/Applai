<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Applai — 登录</title>
<meta name="theme-color" content="#111827">
<link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f6f7;--card:#fff;--ink:#1a1a1a;--body:#595959;--muted:#8c8c8c;--line:#e5e7eb;--blue:#1677ff;--red:#ff4d4f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:36px 32px;width:100%;max-width:380px;}
h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:.5px;}
h1 .dot{color:var(--blue);}
.sub{color:var(--muted);font-size:13px;margin-bottom:24px;}
label{display:block;font-size:13px;color:var(--body);margin:14px 0 5px;font-weight:500;}
input{width:100%;font-size:15px;padding:11px 14px;border:1px solid var(--line);
  border-radius:999px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,255,.15);}
button{width:100%;font-size:15px;padding:12px;border:none;border-radius:999px;
  background:var(--ink);color:#fff;margin-top:20px;cursor:pointer;font-weight:600;transition:background .15s;}
button:hover{background:#333;}
button:active{transform:scale(.98);}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px;}
button.ghost:hover{background:var(--bg);}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px;}
.tabs{display:flex;gap:4px;margin-bottom:6px;background:var(--bg);padding:4px;border-radius:999px;}
.tabs button{margin-top:0;padding:9px;}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.tabs button:not(.on){background:transparent;color:var(--muted);border:none;}
.hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7;}
</style>
</head>
<body>
<div class="card">
  <h1>Applai<span class="dot">.</span></h1>
  <div class="sub">自动求职控制台</div>
  <div class="tabs">
    <button id="tabLogin" class="on">登录</button>
    <button id="tabReg">注册</button>
  </div>
  <form id="form" autocomplete="on">
    <label>用户名 <span style="font-size:11px">（3–32 位，字母/数字/_/-）</span></label>
    <input id="username" name="username" autocomplete="username" required>
    <label>密码 <span style="font-size:11px">（至少 8 位）</span></label>
    <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
    <div class="err" id="err"></div>
    <button type="submit" id="submitBtn">登录</button>
  </form>
  <div class="hint">注册后即可使用：管理求职画像、查看匹配队列与投递进度。<br>要在 Chrome 插件里自动填表，需在登录后的「连接插件」里复制 API Token。</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let mode = "login";
const inviteCode = new URLSearchParams(location.search).get("invite") || "";
if (inviteCode) {
  mode = "register";
  const banner = document.createElement("div");
  banner.style.cssText = "background:#e6f4ff;border:1px solid #91caff;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;color:#1677ff";
  banner.textContent = "🎉 你通过朋友邀请加入 Applai，注册即自动关联";
  document.querySelector(".card").insertBefore(banner, document.querySelector(".tabs"));
}
$("tabLogin").onclick = () => { mode = "login";
  $("tabLogin").classList.add("on"); $("tabReg").classList.remove("on");
  $("submitBtn").textContent = "登录"; $("err").textContent = ""; };
$("tabReg").onclick = () => { mode = "register";
  $("tabReg").classList.add("on"); $("tabLogin").classList.remove("on");
  $("submitBtn").textContent = "注册并进入"; $("err").textContent = ""; };
if (inviteCode) { $("tabReg").click(); }
$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  const body = { username: $("username").value.trim(), password: $("password").value };
  if (mode === "register" && inviteCode) body.invite_code = inviteCode;
  try {
    const r = await fetch(`/api/v1/auth/${mode}`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      credentials: "include", body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $("err").textContent = d.detail || "请求失败"; return; }
    location.href = "/dashboard";
  } catch (err) { $("err").textContent = "网络错误：" + err.message; }
};
</script>
</body>
</html>
