<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Applai Dashboard</title>
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/dashboard/manifest.json">
<link rel="icon" href="/dashboard/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280;
  --line:#e5e7eb; --accent:#111827;
  --green:#047857; --green-bg:#ecfdf5;
  --blue:#1d4ed8; --blue-bg:#eff6ff;
  --orange:#c2410c; --orange-bg:#fff7ed;
  --red:#b91c1c; --red-bg:#fef2f2;
  --purple:#6d28d9; --purple-bg:#f5f3ff;
  --gray:#4b5563; --gray-bg:#f3f4f6;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55;}
header{position:sticky; top:0; z-index:10; background:var(--accent); color:#fff;
  padding:14px 16px calc(14px + env(safe-area-inset-top)) ; padding-top:calc(14px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:10px;}
header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.5px;}
header .sub{font-size:12px; opacity:.65;}
.badge{display:inline-block; font-size:12px; padding:2px 10px; border-radius:999px; font-weight:600;}
.badge.llm-on{background:#065f46; color:#d1fae5;}
.badge.llm-off{background:#3f3f46; color:#e4e4e7;}
main{max-width:720px; margin:0 auto; padding:14px 14px 60px;}
.bar{display:flex; gap:10px; align-items:center; margin:4px 0 14px;}
select{flex:1; font-size:15px; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; background:#fff; color:var(--ink);}
button{font-size:14px; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
  background:#fff; color:var(--ink); cursor:pointer;}
button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
button:active{transform:scale(.97);}
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:16px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 6px; text-align:center;}
.stat .n{font-size:22px; font-weight:700;}
.stat .t{font-size:11px; color:var(--muted); margin-top:2px;}
h2{font-size:16px; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
h2 .count{font-size:12px; color:var(--muted); font-weight:400;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:10px;}
.card .top{display:flex; gap:10px; align-items:flex-start;}
.score{min-width:52px; height:52px; border-radius:12px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; background:var(--accent); color:#fff; flex-shrink:0;}
.score b{font-size:19px; line-height:1;}
.score span{font-size:10px; opacity:.7;}
.card h3{margin:0 0 2px; font-size:15px;}
.card .meta{font-size:13px; color:var(--muted);}
.reasons{margin:8px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px;}
.reasons li{font-size:12px; background:var(--gray-bg); color:var(--gray);
  padding:3px 9px; border-radius:999px;}
.actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.actions a, .actions button{font-size:13px; padding:8px 12px; text-decoration:none;}
.actions a{border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
.st{display:inline-block; font-size:11px; padding:2px 9px; border-radius:999px; font-weight:600;}
.st-queued{background:var(--blue-bg); color:var(--blue);}
.st-filled{background:var(--purple-bg); color:var(--purple);}
.st-submitted{background:var(--green-bg); color:var(--green);}
.st-needs_manual{background:var(--orange-bg); color:var(--orange);}
.st-failed{background:var(--red-bg); color:var(--red);}
.st-skipped{background:var(--gray-bg); color:var(--gray);}
.detail{font-size:13px; color:var(--muted); background:var(--gray-bg); border-radius:8px;
  padding:8px 10px; margin-top:8px; word-break:break-word;}
.time{font-size:12px; color:var(--muted); margin-top:6px;}
.empty{background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
  padding:22px; text-align:center; color:var(--muted); font-size:14px;}
.err{background:var(--red-bg); color:var(--red); border-radius:10px; padding:10px 14px;
  margin-bottom:12px; font-size:14px; display:none;}
.hint{font-size:12px; color:var(--muted); margin-top:6px;}
.loading{color:var(--muted); font-size:14px; padding:16px; text-align:center;}
@media (min-width:640px){ .stats{gap:12px;} }
.pf-view{font-size:14px;}
.pf-view .row{padding:5px 0; border-bottom:1px solid var(--gray-bg);}
.pf-view .row:last-child{border-bottom:none;}
.pf-view .k{color:var(--muted); font-size:12px;}
.pf-form label{display:block; font-size:13px; color:var(--muted); margin:10px 0 2px;}
.pf-form input[type=text], .pf-form input[type=email], .pf-form input[type=number],
.pf-form select, .pf-form textarea{width:100%; font-size:15px; padding:9px 10px;
  border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-family:inherit;}
.pf-form textarea{resize:vertical;}
.pf-form .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
.pf-form .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px;}
.pf-form .check{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink); margin-top:12px;}
.pf-form .check input{width:18px; height:18px;}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--accent); color:#fff; font-size:14px; padding:10px 18px;
  border-radius:999px; display:none; z-index:50; box-shadow:0 4px 16px rgba(0,0,0,.2);}
.sec-head{display:flex; align-items:center; gap:8px;}
.sec-head button{margin-left:auto; font-size:13px; padding:7px 12px;}
</style>
</head>
<body>
<header>
  <h1>Applai</h1>
  <span class="sub">投递控制台</span>
  <span style="flex:1"></span>
  <span id="llmBadge" class="badge llm-off">LLM …</span>
</header>
<main>
  <div id="err" class="err"></div>
  <div id="toast" class="toast"></div>

  <div class="bar">
    <select id="userSel" aria-label="选择用户"></select>
    <button id="refreshBtn" class="primary">刷新</button>
  </div>
  <div class="hint">用户 ID 可在浏览器插件 popup 的「用户 ID」一栏复制。若下拉框已有，直接选择即可。</div>

  <h2 class="sec-head">👤 求职画像 <button id="pfEditBtn">编辑</button></h2>
  <div class="card">
    <div id="pfView" class="pf-view"><div class="loading">加载中…</div></div>
    <div id="pfForm" class="pf-form" style="display:none"></div>
    <div class="actions" id="pfActions" style="display:none">
      <button class="primary" id="pfSaveBtn">保存画像</button>
      <button id="pfCancelBtn">取消</button>
    </div>
    <div class="hint" id="pfResumeHint"></div>
  </div>

  <div class="stats" id="stats"></div>

  <h2>📋 今日队列 <span class="count" id="queueCount"></span></h2>
  <div id="queue"><div class="loading">加载中…</div></div>

  <h2>⚠️ 待人工处理 <span class="count" id="manualCount"></span></h2>
  <div id="manual"><div class="loading">加载中…</div></div>

  <h2>🗂️ 申请历史</h2>
  <div id="history"><div class="loading">加载中…</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const STATUS_LABEL = {
  queued:"待投递", filled:"已填写", submitted:"已投递",
  needs_manual:"待人工", failed:"失败", skipped:"已跳过"
};
const stBadge = (s) => `<span class="st st-${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;
const fmtTime = (ts) => {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toLocaleString("zh-CN", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
};
const showErr = (msg) => { const e = $("err"); e.textContent = msg; e.style.display = "block"; };
const clearErr = () => { $("err").style.display = "none"; };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    const t = await r.text().catch(() => "");
    throw new Error(`请求失败 ${r.status} ${t.slice(0,120)}`);
  }
  return r.json();
}

function userId() { return $("userSel").value; }

async function loadUsers() {
  const data = await api("/api/v1/users");
  const sel = $("userSel");
  sel.innerHTML = "";
  const saved = localStorage.getItem("applai_dashboard_user") || "";
  data.users.forEach((u) => {
    const o = document.createElement("option");
    o.value = u.user_id;
    o.textContent = `${u.label} (${u.user_id.slice(0,8)}…)`;
    sel.appendChild(o);
  });
  if (!data.users.length) {
    const o = document.createElement("option");
    o.value = ""; o.textContent = "暂无用户（先在插件里同步画像）";
    sel.appendChild(o);
  } else if (saved && [...sel.options].some((o) => o.value === saved)) {
    sel.value = saved;
  }
  sel.onchange = () => {
    localStorage.setItem("applai_dashboard_user", sel.value);
    loadAll();
  };
}

async function loadHealth() {
  try {
    const h = await api("/health");
    const b = $("llmBadge");
    if (h.llm) { b.textContent = "LLM 已启用"; b.className = "badge llm-on"; }
    else { b.textContent = "LLM 未启用"; b.className = "badge llm-off"; }
  } catch (e) { /* 忽略，页面本身已通过鉴权 */ }
}

function jobCard(j) {
  const reasons = (j.score_reasons || []).map((r) => `<li>${esc(r)}</li>`).join("");
  return `<div class="card"><div class="top">
    <div class="score"><b>${esc(j.score)}</b><span>分</span></div>
    <div><h3>${esc(j.title)}</h3>
      <div class="meta">${esc(j.company || "")} · ${esc(j.location || "")}</div>
    </div></div>
    ${reasons ? `<ul class="reasons">${reasons}</ul>` : ""}
    <div class="actions">
      ${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">去投递 ↗</a>` : ""}
      <button data-act="skip" data-job="${j.id}">跳过</button>
    </div></div>`;
}

function appCard(a, showActions) {
  const btns = showActions ? `<div class="actions">
      ${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">打开职位页 ↗</a>` : ""}
      <button class="primary" data-act="submitted" data-job="${a.job_id}">已手动投递</button>
      <button data-act="skipped" data-job="${a.job_id}">跳过</button>
    </div>` : "";
  return `<div class="card"><div class="top"><div>
    <h3>${esc(a.title || "(未知职位)")} ${stBadge(a.status)}</h3>
    <div class="meta">${esc(a.company || "")}</div></div></div>
    ${a.detail ? `<div class="detail">${esc(a.detail)}</div>` : ""}
    <div class="time">更新于 ${esc(fmtTime(a.updated_at))}</div>
    ${btns}</div>`;
}

async function loadQueue() {
  const box = $("queue");
  try {
    const d = await api(`/api/v1/queue?user_id=${encodeURIComponent(userId())}&top_n=10`);
    $("queueCount").textContent = `共 ${d.count} 个`;
    box.innerHTML = d.jobs.length ? d.jobs.map(jobCard).join("")
      : `<div class="empty">今日队列为空。可能职位库还没有数据，先在插件里跑一次职位发现。</div>`;
  } catch (e) { box.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; }
}

async function loadApps() {
  const uid = encodeURIComponent(userId());
  let apps = [];
  try { apps = (await api(`/api/v1/applications?user_id=${uid}`)).applications || []; }
  catch (e) { showErr("申请记录加载失败：" + e.message); return; }

  const manual = apps.filter((a) => a.status === "needs_manual");
  $("manualCount").textContent = `共 ${manual.length} 个`;
  $("manual").innerHTML = manual.length ? manual.map((a) => appCard(a, true)).join("")
    : `<div class="empty">没有需要人工处理的申请 🎉</div>`;

  $("history").innerHTML = apps.length ? apps.map((a) => appCard(a, false)).join("")
    : `<div class="empty">还没有申请记录。</div>`;

  // 统计
  let s = {};
  try { s = (await api(`/api/v1/stats?user_id=${uid}`)).stats || {}; } catch (e) {}
  const defs = [["queued","待投递"],["submitted","已投递"],["needs_manual","待人工"],["skipped","已跳过"]];
  $("stats").innerHTML = defs.map(([k, t]) =>
    `<div class="stat"><div class="n">${s[k] || 0}</div><div class="t">${t}</div></div>`).join("");
}

async function markApp(jobId, status) {
  clearErr();
  try {
    await api("/api/v1/applications", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: userId(), job_id: Number(jobId), status, detail: "dashboard 手动标记"})
    });
    await loadApps();
  } catch (e) { showErr("标记失败：" + e.message); }
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-act]");
  if (b) markApp(b.dataset.job, b.dataset.act);
});
$("refreshBtn").onclick = () => loadAll();

async function loadAll() {
  clearErr();
  if (!userId()) return;
  await Promise.all([loadHealth(), loadProfile(), loadQueue(), loadApps()]);
}

/* ---------- 求职画像 ---------- */
const LIST_KEYS = ["targetTitles", "industries", "preferredLocations"];
const PF_FIELDS = [
  {k:"firstName", t:"名"}, {k:"lastName", t:"姓"},
  {k:"email", t:"邮箱", type:"email"}, {k:"phone", t:"电话"},
  {k:"location", t:"现居地"},
  {k:"linkedin", t:"LinkedIn"}, {k:"github", t:"GitHub"}, {k:"website", t:"个人网站"},
  {k:"targetTitles", t:"目标职位（逗号分隔）", list:1},
  {k:"industries", t:"行业（逗号分隔）", list:1},
  {k:"yearsExperience", t:"工作年限", type:"number"},
  {k:"remotePreference", t:"远程偏好", type:"select",
   options:[["any","不限"],["remote","纯远程"],["hybrid","混合"],["onsite","坐班"]]},
  {k:"preferredLocations", t:"期望地点（逗号分隔）", list:1},
  {k:"salaryMin", t:"薪资下限", type:"number"},
  {k:"salaryMax", t:"薪资上限", type:"number"},
  {k:"salaryCurrency", t:"币种", type:"select",
   options:[["CAD","CAD"],["USD","USD"],["CNY","CNY"]]},
  {k:"workAuth", t:"工作许可"},
  {k:"needsSponsorship", t:"需要雇主担保签证", type:"checkbox"},
  {k:"coverLetter", t:"通用求职信", type:"textarea"},
];
let currentProfile = null;   // 后端现有画像（含 resumeFile）
let pendingResume = null;    // 本次新上传的简历
const toast = (msg) => {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2200);
};
const splitList = (v) => String(v || "").split(/[,，]/).map((s) => s.trim()).filter(Boolean);

function pfSummaryRow(k, v) {
  if (v == null || v === "" || (Array.isArray(v) && !v.length)) return "";
  const val = Array.isArray(v) ? v.map(esc).join("、") : esc(v);
  return `<div class="row"><div class="k">${esc(k)}</div><div>${val}</div></div>`;
}

function renderPfView(p) {
  const box = $("pfView");
  if (!p) {
    box.innerHTML = `<div class="empty">还没有画像，点击右上角「编辑」创建。</div>`;
    $("pfResumeHint").textContent = "";
    return;
  }
  const name = [p.firstName, p.lastName].filter(Boolean).join(" ");
  const salary = (p.salaryMin || p.salaryMax)
    ? `${p.salaryMin || "?"}–${p.salaryMax || "?"} ${p.salaryCurrency || ""}` : "";
  box.innerHTML =
    pfSummaryRow("姓名", name) +
    pfSummaryRow("邮箱 / 电话", [p.email, p.phone].filter(Boolean).join(" · ")) +
    pfSummaryRow("现居地", p.location) +
    pfSummaryRow("目标职位", p.targetTitles) +
    pfSummaryRow("工作年限", p.yearsExperience) +
    pfSummaryRow("期望薪资", salary) +
    pfSummaryRow("期望地点", p.preferredLocations) +
    pfSummaryRow("远程偏好", {any:"不限", remote:"纯远程", hybrid:"混合", onsite:"坐班"}[p.remotePreference]) +
    pfSummaryRow("工作许可", p.workAuth) +
    (p.needsSponsorship ? pfSummaryRow("签证担保", "需要雇主担保") : "");
  const rf = p.resumeFile;
  $("pfResumeHint").textContent = rf && rf.name
    ? `简历：${rf.name}（已上传）` : "简历：未上传（编辑时可上传 PDF）";
}

function renderPfForm(p) {
  const f = $("pfForm");
  p = p || {};
  let h = "";
  const val = (k) => {
    const v = p[k];
    if (LIST_KEYS.includes(k)) return esc((v || []).join(", "));
    return esc(v == null ? "" : v);
  };
  PF_FIELDS.forEach((fd) => {
    const id = "pf_" + fd.k;
    if (fd.type === "select") {
      const opts = fd.options.map(([v, t]) =>
        `<option value="${v}"${String(p[fd.k] || "") === v ? " selected" : ""}>${esc(t)}</option>`).join("");
      h += `<label>${esc(fd.t)}<select id="${id}">${opts}</select></label>`;
    } else if (fd.type === "checkbox") {
      h += `<label class="check"><input type="checkbox" id="${id}"${p[fd.k] ? " checked" : ""}> ${esc(fd.t)}</label>`;
    } else if (fd.type === "textarea") {
      h += `<label>${esc(fd.t)}<textarea id="${id}" rows="4">${val(fd.k)}</textarea></label>`;
    } else {
      h += `<label>${esc(fd.t)}<input type="${fd.type || "text"}" id="${id}" value="${val(fd.k)}"></label>`;
    }
  });
  const rf = p.resumeFile;
  h += `<label>简历 PDF <span style="font-size:12px">（${rf && rf.name ? "当前：" + esc(rf.name) + "，不选则保留" : "未上传"}）</span>
    <input type="file" id="pf_resume" accept=".pdf,.doc,.docx"></label>
    <div class="hint" id="pfResumeNew"></div>`;
  f.innerHTML = h;
  $("pf_resume").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) { pendingResume = null; $("pfResumeNew").textContent = ""; return; }
    if (file.size > 4 * 1024 * 1024) { toast("文件超过 4MB，请压缩后上传"); e.target.value = ""; return; }
    const r = new FileReader();
    r.onload = () => {
      pendingResume = { name: file.name, size: file.size, dataUrl: r.result };
      $("pfResumeNew").textContent = `已选择：${file.name}（保存后生效）`;
    };
    r.readAsDataURL(file);
  });
}

async function loadProfile() {
  try {
    const d = await api(`/api/v1/profile?user_id=${encodeURIComponent(userId())}`);
    currentProfile = d.profile || null;
    renderPfView(currentProfile);
  } catch (e) {
    $("pfView").innerHTML = `<div class="empty">画像加载失败：${esc(e.message)}</div>`;
  }
}

function openPfEdit() {
  pendingResume = null;
  renderPfForm(currentProfile);
  $("pfView").style.display = "none";
  $("pfForm").style.display = "block";
  $("pfActions").style.display = "flex";
  $("pfEditBtn").style.display = "none";
}
function closePfEdit() {
  $("pfView").style.display = "block";
  $("pfForm").style.display = "none";
  $("pfActions").style.display = "none";
  $("pfEditBtn").style.display = "";
}

async function saveProfile() {
  clearErr();
  const p = {};
  PF_FIELDS.forEach((fd) => {
    const el = $("pf_" + fd.k);
    if (fd.type === "checkbox") { p[fd.k] = el.checked; return; }
    if (LIST_KEYS.includes(fd.k)) { p[fd.k] = splitList(el.value); return; }
    const v = el.value.trim();
    p[fd.k] = (fd.type === "number") ? (v === "" ? null : Number(v)) : v;
  });
  if (!p.email) { toast("请填写邮箱"); return; }
  if (pendingResume) p.resumeFile = pendingResume;
  else if (currentProfile && currentProfile.resumeFile) p.resumeFile = currentProfile.resumeFile;
  try {
    await api("/api/v1/profile", {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: userId(), profile: p})
    });
    // 同步用户下拉框的标签
    await loadUsers();
    $("userSel").value = userId();
    currentProfile = p;
    renderPfView(p);
    closePfEdit();
    toast("画像已保存 ✓");
  } catch (e) { showErr("保存失败：" + e.message); }
}

$("pfEditBtn").onclick = openPfEdit;
$("pfCancelBtn").onclick = closePfEdit;
$("pfSaveBtn").onclick = saveProfile;

(async () => {
  try {
    await loadHealth();
    await loadUsers();
    await loadAll();
  } catch (e) { showErr("初始化失败：" + e.message); }
})();
</script>
