# 每 4 小时：Gmail 求职邮件同步（面试/拒信识别）
name: email-sync
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          curl -s --max-time 300 -X POST https://applai-backend.fly.dev/api/v1/admin/email-sync \
            -H "x-cron-token: ${{ secrets.APPLAI_CRON_TOKEN }}" | head -c 300
          echo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
