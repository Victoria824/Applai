name: pg-diag
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          echo "=== pg clusters ==="
          flyctl postgres list 2>&1 | head -8
          echo "=== applai-db machines ==="
          flyctl machine list --app applai-db 2>&1 | head -6
          echo "=== applai-db status ==="
          flyctl status --app applai-db 2>&1 | head -12
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
