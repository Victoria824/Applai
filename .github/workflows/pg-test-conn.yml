name: pg-test-conn
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          # 在 applai-db 机器上本地测试密码
          MID=$(flyctl machine list --app applai-db --json | python3 -c "import json,sys; ms=json.load(sys.stdin); print([m['id'] for m in ms if m['state']=='started'][0])")
          echo "pg machine: $MID"
          flyctl machine exec $MID "PGPASSWORD=${{ secrets.TEMP_PG_PASS }} psql -U postgres -h localhost -c 'SELECT 1;'" 2>&1 | tail -3
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
