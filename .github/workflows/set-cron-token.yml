name: set-cron-token-once
on:
  workflow_dispatch:
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl secrets set --app applai-backend APPLAI_CRON_TOKEN="${{ secrets.TEMP_CRON_TOKEN }}" 2>&1 | tail -1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
