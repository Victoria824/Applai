name: pg-fixpass
on:
  workflow_dispatch:
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          MID=$(flyctl machine list --app applai-db --json | python3 -c "import json,sys; ms=json.load(sys.stdin); print([m['id'] for m in ms if m['state']=='started'][0])")
          echo "pg machine: $MID"
          # secret 值在日志中自动脱敏，可直接内联
          flyctl machine exec "$MID" --app applai-db -- sh -c 'psql -U postgres -c "ALTER USER postgres PASSWORD '"'"'${{ secrets.TEMP_PG_PASS }}'"'"';" 2>&1 | tail -3'
          echo "=== password updated ==="
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
