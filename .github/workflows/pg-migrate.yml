# 一次性：SQLite → Postgres 数据迁移。用完即删。
name: pg-migrate-once
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          MID=$(flyctl machine list --app applai-backend --json | python3 -c "import json,sys; ms=json.load(sys.stdin); print([m['id'] for m in ms if m['state']=='started'][0])")
          echo "machine: $MID"
          flyctl machine exec --app applai-backend $MID "sh -c 'cd /srv && APPLAI_DB=/data/applai.db python3 migrate_sqlite_to_pg.py'" 2>&1 | tail -25
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
