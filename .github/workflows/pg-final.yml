name: pg-final
on:
  workflow_dispatch:
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          # 设置迁移 token（用完即删）
          flyctl secrets set --app applai-backend APPLAI_MIGRATE_TOKEN="${{ secrets.TEMP_MIGRATE_TOKEN }}" 2>&1 | tail -1
          sleep 45
          echo "=== running migration ==="
          curl -s --max-time 120 -X POST https://applai-backend.fly.dev/api/v1/admin/migrate-sqlite \
            -H "x-migrate-token: ${{ secrets.TEMP_MIGRATE_TOKEN }}" | head -c 600
          echo
          echo "=== unsetting token ==="
          flyctl secrets unset --app applai-backend APPLAI_MIGRATE_TOKEN 2>&1 | tail -1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
