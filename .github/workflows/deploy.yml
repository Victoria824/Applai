name: Deploy backend to Fly.io

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure data volume exists (one-time)
        run: |
          if flyctl volumes list -a applai-backend 2>/dev/null | grep -q applai_data; then
            echo "volume applai_data already exists"
          else
            flyctl volumes create applai_data --region yyz --size 1 --yes -a applai-backend
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only -a applai-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
