name: pg-debug
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl secrets set --app applai-backend TEST_CANARY=hello123 2>&1 | tail -1
          sleep 60
          MID=$(flyctl machine list --app applai-backend --json | python3 -c "import json,sys; ms=json.load(sys.stdin); print([m['id'] for m in ms if m['state']=='started'][0])")
          echo "=== exec output ==="
          flyctl machine exec --app applai-backend $MID -- sh -c 'env | grep TEST_CANARY' 2>&1 | tail -3
          echo "=== end ==="
          flyctl secrets unset --app applai-backend TEST_CANARY 2>&1 | tail -1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
