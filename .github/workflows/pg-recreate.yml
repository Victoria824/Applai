# 一次性：重建 PG 集群（已知密码）+ 迁移数据。用完即删。
# 密码来自 GitHub secret TEMP_PG_PASS，日志中自动脱敏。
name: pg-recreate-once
on:
  workflow_dispatch:

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          set -e
          # 1. 删掉空的旧集群（还没有数据，安全）
          flyctl postgres destroy --app applai-db --yes 2>&1 | tail -1 || true
          sleep 10
          # 2. 用已知密码重建
          flyctl postgres create --name applai-db --region yyz \
            --vm-size shared-cpu-1x --volume-size 1 --initial-cluster-size 1 \
            --password "${{ secrets.TEMP_PG_PASS }}" 2>&1 | tail -2
          # 3. 等集群就绪
          for i in $(seq 1 30); do
            sleep 10
            if flyctl postgres db list --app applai-db 2>/dev/null | grep -q postgres; then
              echo "cluster ready"; break
            fi
          done
          # 4. 建业务库
          flyctl postgres db create --app applai-db applai 2>&1 | tail -1 || true
          # 5. 直接设 APPLAI_DB_URL（密码来自 secret，日志脱敏）
          flyctl secrets set --app applai-backend \
            APPLAI_DB_URL="postgres://postgres:${{ secrets.TEMP_PG_PASS }}@applai-db.internal:5432/applai" 2>&1 | tail -1
          echo "=== secrets set, waiting for deploy ==="
          sleep 60
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
