name: set-google-once
on:
  workflow_dispatch:
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          flyctl secrets set --app applai-backend \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" 2>&1 | tail -2
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
