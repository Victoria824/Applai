name: pg-nuke
on:
  workflow_dispatch:
jobs:
  n:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          set -eo pipefail
          echo "=== destroying ==="
          flyctl apps destroy applai-db --yes
          echo "=== waiting for destroy ==="
          for i in $(seq 1 30); do
            sleep 10
            if ! flyctl postgres list 2>/dev/null | grep -q applai-db; then
              echo "destroyed"; break
            fi
            echo "waiting... $i"
          done
          echo "=== creating ==="
          flyctl postgres create --name applai-db --region yyz \
            --vm-size shared-cpu-1x --volume-size 1 --initial-cluster-size 1 \
            --password "${{ secrets.TEMP_PG_PASS }}"
          echo "=== waiting for ready ==="
          for i in $(seq 1 30); do
            sleep 10
            if flyctl postgres db list --app applai-db 2>/dev/null | grep -q postgres; then
              echo "ready"; break
            fi
          done
          echo "=== creating applai db ==="
          flyctl postgres db create --app applai-db applai
          echo "=== DONE ==="
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
